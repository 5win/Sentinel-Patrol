<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sentinel Patrol Dashboard</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #1e1e1e; color: #eee; }
  #header {
    padding: 10px 16px;
    background: #2a2a2a;
    display: flex;
    gap: 24px;
    align-items: center;
    border-bottom: 1px solid #444;
  }
  #header h3 { margin: 0; font-weight: 500; }
  #status { font-size: 14px; padding: 2px 8px; border-radius: 4px; }
  #status.ok { color: #6f6; background: #1a3a1a; }
  #status.err { color: #f66; background: #3a1a1a; }
  #state {
    font-size: 13px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 4px;
    letter-spacing: 0.5px;
    color: #ccc;
    background: #333;
  }
  #state.idle       { color: #bbb; background: #333; }
  #state.patrolling { color: #6f6; background: #1a3a1a; }
  #state.wait       { color: #eec; background: #3a3a1a; }
  #state.emergency  { color: #f66; background: #3a1a1a; }
  #state.avoiding   { color: #fa6; background: #3a2a1a; }
  #state.returning  { color: #6cf; background: #1a2a3a; }
  #pose { font-family: monospace; font-size: 13px; color: #aaa; }
  #canvas-wrap { padding: 16px; }
  canvas {
    background: #000;
    display: block;
    max-width: 100%;
    height: auto;
    border: 1px solid #444;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
  <div id="header">
    <h3>Sentinel Patrol</h3>
    <span id="status" class="err">disconnected</span>
    <span id="state">—</span>
    <span id="pose">pose: —</span>
  </div>
  <div id="canvas-wrap">
    <canvas id="map"></canvas>
  </div>

  <script src="map_config.js"></script>
  <script>
    const cfg = window.MAP_CONFIG;
    if (!cfg) {
      document.body.innerHTML =
        '<p style="padding:20px;color:#f66">map_config.js not found. Run prepare_map.py first.</p>';
      throw new Error('missing MAP_CONFIG');
    }

    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    canvas.width = cfg.width;
    canvas.height = cfg.height;

    const statusEl = document.getElementById('status');
    const stateEl = document.getElementById('state');
    const poseEl = document.getElementById('pose');

    const mapImg = new Image();
    let mapReady = false;
    mapImg.onload = () => { mapReady = true; render(); };
    mapImg.src = cfg.image;

    let robot = null;
    let plan = null;

    // World (meters) → canvas pixel. ROS y goes up, canvas y goes down → flip.
    function worldToPixel(wx, wy) {
      const px = (wx - cfg.origin.x) / cfg.resolution;
      const py = cfg.height - (wy - cfg.origin.y) / cfg.resolution;
      return [px, py];
    }

    function drawPlan() {
      if (!plan || plan.length < 2) return;
      ctx.strokeStyle = 'rgba(100, 180, 255, 0.85)';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      for (let i = 0; i < plan.length; i++) {
        const [px, py] = worldToPixel(plan[i].x, plan[i].y);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    function drawRobot() {
      if (!robot) return;
      const [px, py] = worldToPixel(robot.x, robot.y);
      const r = 8;

      const dx = Math.cos(robot.yaw) * (r * 2);
      const dy = -Math.sin(robot.yaw) * (r * 2);

      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + dx, py + dy);
      ctx.stroke();

      ctx.fillStyle = '#00ff88';
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#003322';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    function render() {
      if (!mapReady) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(mapImg, 0, 0);
      drawPlan();
      drawRobot();
    }

    // Connect to fleet backend WebSocket (served by the same FastAPI process)
    let ws;
    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onopen  = () => { statusEl.textContent = 'connected';    statusEl.className = 'ok';  };
      ws.onclose = () => {
        statusEl.textContent = 'disconnected';
        statusEl.className = 'err';
        setTimeout(connect, 1000);
      };
      ws.onerror = () => { /* onclose will follow */ };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === 'pose') {
          const { x, y, yaw } = msg.data;
          robot = { x, y, yaw };
          poseEl.textContent =
            `pose: x=${x.toFixed(2)}  y=${y.toFixed(2)}  yaw=${(yaw * 180 / Math.PI).toFixed(1)}°`;
          render();
        } else if (msg.type === 'plan') {
          plan = msg.data;
          render();
        } else if (msg.type === 'state') {
          stateEl.textContent = msg.data;
          stateEl.className = msg.data.toLowerCase();
        }
      };
    }
    connect();
  </script>
</body>
</html>
